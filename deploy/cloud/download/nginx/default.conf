server {
    listen 8080;
    server_name _;

    root /srv/releases;
    charset utf-8;
    autoindex off;
    server_tokens off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The index is the only documented discovery endpoint. Individual version
    # manifests are also explicit files, so a client cannot browse the tree.
    location = /index.json {
        default_type application/json;
        add_header Cache-Control "no-cache";

        # File service is read-only; nginx must return 404 rather than trying
        # to create anything in the mounted volume.
        try_files /index.json =404;
    }

    location ~ ^/(?<release_version>[0-9]+\.[0-9]+\.[0-9]+)/(?<release_channel>[a-z][a-z0-9._-]*)/manifest\.json$ {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files /$release_version/$release_channel/manifest.json =404;
    }

    location ~ ^/(?<release_version>[0-9]+\.[0-9]+\.[0-9]+)/(?<release_channel>[a-z][a-z0-9._-]*)/(?<release_platform>[a-z][a-z0-9._-]*)/(?<release_kind>[a-z][a-z0-9._-]*)/(?<release_file>[A-Za-z0-9._+-]+)$ {
        types {
            application/vnd.android.package-archive apk;
            application/gzip gz;
            application/zip zip;
            application/octet-stream bin;
            text/plain txt;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files /$release_version/$release_channel/$release_platform/$release_kind/$release_file =404;
    }

    location = /SHA256SUMS {
        default_type text/plain;
        add_header Cache-Control "no-cache";
        try_files /SHA256SUMS =404;
    }

    location / {
        return 404;
    }
}
