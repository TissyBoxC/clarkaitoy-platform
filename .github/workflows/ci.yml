name: Platform CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/contracts/package-lock.json
      - name: Install contract tooling
        working-directory: tools/contracts
        run: npm ci
      - name: Validate shared contracts
        working-directory: tools/contracts
        run: npm run validate

  go-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - device_platform
          - voice_gateway
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: go test ./...
      - name: Build ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: go build ./...

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/admin_web/package-lock.json
      - name: Install admin web dependencies
        working-directory: apps/admin_web
        run: npm ci
      - name: Type-check and build admin web
        working-directory: apps/admin_web
        run: npm run build

  parent-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install parent app dependencies
        working-directory: apps/parent_app
        run: flutter pub get
      - name: Analyze parent app
        working-directory: apps/parent_app
        run: flutter analyze
      - name: Test parent app
        working-directory: apps/parent_app
        run: flutter test
