name: Platform CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate release failure isolation
        run: python3 tools/test_release_workflow.py

  local-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/local-deployment/package-lock.json
      - name: Install local deployment tooling
        working-directory: tools/local-deployment
        run: npm ci
      - name: Validate local deployment configuration
        working-directory: tools/local-deployment
        run: npm run validate

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/contracts/package-lock.json
      - name: Install contract tooling
        working-directory: tools/contracts
        run: npm ci
      - name: Validate shared contracts
        working-directory: tools/contracts
        run: npm run validate
      - name: Check generated types are current
        working-directory: tools/contracts
        run: |
          npm run generate
          git diff --exit-code -- \
            ../../packages/contracts/generated \
            ../../apps/parent_app/lib/core/contracts/generated

  go-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - device_platform
          - voice_gateway
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: go test ./...
      - name: Build ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: go build ./...

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/admin_web/package-lock.json
      - name: Install admin web dependencies
        working-directory: apps/admin_web
        run: npm ci
      - name: Type-check and build admin web
        working-directory: apps/admin_web
        run: npm run build

  parent-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install parent app dependencies
        working-directory: apps/parent_app
        run: flutter pub get
      - name: Analyze parent app
        working-directory: apps/parent_app
        run: flutter analyze
      - name: Test parent app
        working-directory: apps/parent_app
        run: flutter test
      - name: Build Android APK
        working-directory: apps/parent_app
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false
        run: flutter build apk --release --target-platform android-arm,android-arm64
