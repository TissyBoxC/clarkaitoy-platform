openapi: 3.0.3
info:
  title: 芽系列·初芽 Device Platform API
  version: 1.0.0
security:
  - serviceToken: []
paths:
  /healthz:
    get:
      summary: Check service health
      security: []
      responses:
        "200":
          description: Service is healthy
  /readyz:
    get:
      summary: Check service readiness
      security: []
      responses:
        "200":
          description: Service is ready
  /internal/v1/runtime:
    get:
      summary: Read service runtime information
      responses:
        "200":
          description: Runtime information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /internal/v1/devices/{device_id}/ai-credential:
    get:
      summary: Resolve the AI credential for one bound device
      description: >
        Returns the decrypted provider key owned by the bound guardian. This
        endpoint is restricted to the internal AI relay service token and must
        never be exposed to guardians, administrators, or firmware clients.
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      responses:
        "200":
          description: Device AI credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "404":
          description: Device or credential not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: service-token
  schemas:
    ResponseEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - data
        - error
      properties:
        schema_version:
          type: string
          const: 1.0.0
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        data:
          type: object
          nullable: true
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,63}$"
        message:
          type: string
          minLength: 1
          maxLength: 256
        retryable:
          type: boolean
