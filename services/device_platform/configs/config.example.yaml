http:
  host: "0.0.0.0"
  port: "8081"

internal:
  # Keep the management API disabled until service identity is configured.
  enabled: false
  auth_token: "change-me"

log:
  level: "info"

database:
  dsn: "postgres://device_platform:change-me@127.0.0.1:5432/device_platform?sslmode=disable"

redis:
  address: "127.0.0.1:6379"
  password: ""

mqtt:
  broker: "tls://127.0.0.1:8883"
  client_id: "device-platform"
  username: ""
  password: ""
  ca_file: "deploy/mosquitto/certs/ca.crt"
  client_certificate_file: "deploy/mosquitto/certs/device.crt"
  client_key_file: "deploy/mosquitto/certs/device.key"
  insecure_skip_verify: false
