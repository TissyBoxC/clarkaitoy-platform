# Static host for the admin console bundle.
#
# The console talks to device_platform through VITE_API_BASE_URL, so this
# server only needs to serve files, answer SPA routes, and expose a probe.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Build output is immutable per release; only index.html may change.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vue Router uses history mode, so unknown paths must return the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never leak the server version to clients.
    server_tokens off;
}
